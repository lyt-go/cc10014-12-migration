services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      # SQLite 数据库固定到挂载卷，容器重启/升级后工序与排期数据可恢复。
      - APP_DB_PATH=/srv/data/app.sqlite3
    volumes:
      - backend_data:/srv/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
